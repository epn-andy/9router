name: Build CLI

# Offload Next.js + CLI pack from weak local CPU. Produces a downloadable
# npm pack tarball as an artifact (and as a GitHub Release asset on v* tags).
# Optional npm publish when NPM_TOKEN secret is set.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_npm:
        description: "Also npm publish (needs NPM_TOKEN secret)"
        type: boolean
        default: false

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install root deps
        run: npm install --no-audit --no-fund

      - name: Install CLI deps
        run: npm --prefix cli install --no-audit --no-fund

      # cli/package.json pack:cli uses --pack-destination ../.. which lands
      # outside GITHUB_WORKSPACE. Build at root then pack into workspace root.
      - name: Build Next.js app + pack CLI
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build
          # assemble cli/app (MITM + standalone) then pack tarball here
          npm --prefix cli run build
          npm --prefix cli pack --pack-destination "$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE"/9router-*.tgz

      - name: Upload CLI tarball
        uses: actions/upload-artifact@v4
        with:
          name: 9router-cli-${{ github.sha }}
          path: 9router-*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: 9router-*.tgz
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Publish to npm
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event_name == 'workflow_dispatch' && inputs.publish_npm == true)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret not set — skip publish"
            exit 0
          fi
          npm --prefix cli publish --access public
